name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      db_url:
        description: "Optional direct URL to cbyd.db to bundle inside Aufstieg.app"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download cbyd.db (optional)
        env:
          DB_URL: ${{ inputs.db_url || vars.CBYD_DB_URL || '' }}
        run: |
          if [[ -n "$DB_URL" ]]; then
            echo "Downloading cbyd.db..."
            curl -fL "$DB_URL" -o cbyd.db
            ls -lh cbyd.db
          else
            echo "No DB_URL provided — building online-capable Aufstieg.app without embedded cbyd.db."
          fi

      - name: Build Aufstieg.app, DMG & PKG Installer
        run: |
          chmod +x build_macos.sh start_macos.command
          ./build_macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aufstieg-macOS-${{ matrix.arch }}
          path: |
            dist/Aufstieg-macOS-*.pkg
            dist/Aufstieg-macOS-*.dmg
          if-no-files-found: error

      - name: Publish PKG & DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v0.1.0-macos >/dev/null 2>&1; then
            gh release create v0.1.0-macos --title "Aufstieg | Химия (macOS)" --notes "Готовый установщик (.pkg) и образ (.dmg) для macOS с вшитой базой cbyd.db." || true
          fi
          gh release upload v0.1.0-macos dist/Aufstieg-macOS-*.pkg dist/Aufstieg-macOS-*.dmg --clobber
