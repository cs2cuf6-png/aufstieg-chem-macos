[project]
name = "cbyd-flashcards"
version = "0.1.0"
description = "Autonomous CLI/TUI tool to convert Chemistry By Design total syntheses into self-contained offline HTML flashcards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "textual>=0.85.0",
    "rich>=13.9.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "pywebview>=5.0",
]

[project.scripts]
cbyd = "cbyd_flashcards.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
